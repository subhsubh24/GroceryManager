name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # Native (Expo) app gate. apps/mobile is excluded from the pnpm workspace and starts life as a
  # non-functional skeleton, so this job GRACEFULLY SKIPS until Expo is initialized (a tsconfig.json
  # + a `typecheck` script appear). Once the native app is real, the job installs apps/mobile on its
  # own and runs its typecheck — so broken mobile code blocks auto-merge. Safe to mark "required"
  # from day one because it always passes while the app is still a skeleton.
  mobile:
    name: mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mobile typecheck (graceful skip until Expo is initialized)
        run: |
          set -e
          if [ ! -f apps/mobile/tsconfig.json ] || ! grep -q '"typecheck"' apps/mobile/package.json; then
            echo "apps/mobile is still a skeleton (no tsconfig.json / no typecheck script) — skipping. ✅"
            exit 0
          fi
          echo "apps/mobile is initialized — installing + typechecking the native app."
          cd apps/mobile
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
          npm run typecheck

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Test
        run: pnpm -r run test

      - name: Build
        run: |
          set -o pipefail
          pnpm --filter @gm/web build 2>&1 | tee build.log
          # next build exits 0 even when a re-export is missing (force-dynamic pages aren't
          # prerendered, so it's only a warning) — but those break at runtime (e.g. a bad icon
          # re-export). Fail the gate on them so the build can't go green while secretly broken.
          if grep -qiE "Attempted import error|export .* was not found|is not exported from" build.log; then
            echo "::error::Build emitted missing-export warnings — these break at runtime. Failing CI."
            exit 1
          fi
        env:
          # Pages are force-dynamic (env read at request time), but set a dummy so any build-time
          # loadEnv() validation passes. No real secrets needed.
          DATABASE_URL: postgresql://user:pass@localhost:5432/db

  # Run the WHOLE migration chain against a throwaway Postgres so a bad migration (e.g. a SQL scoping
  # bug) fails CI here instead of on someone's real database. pgvector image = the `vector` + `pg_trgm`
  # extensions sql/0000 needs. Uses tsx directly (db:migrate expects a local .env that CI doesn't have).
  migrate:
    name: migrations (fresh db)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrate (full chain, fresh DB)
        run: pnpm --filter @gm/db exec tsx src/migrate.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gm
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gm

  # Lint gate (F1) — eslint --max-warnings=0 on apps/web. Deterministic; safe to require.
  lint:
    name: lint (web, zero warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @gm/web lint

  # Functional E2E journeys (BUILDS != WORKS) — build the app, migrate a throwaway Postgres, start the
  # app, and replay the outcome-asserting user journeys (signup -> working dashboard, never an error
  # screen; every nav target resolves). The suite SELF-SEEDS via real signup, so it just needs a
  # migrated DB + the app running with DIRECT_DATABASE_URL set (the prod-outage lesson). Captcha fails
  # open without a Turnstile key, so signup works in CI. NOTE: NON-required initially — flip it to a
  # required status check in branch protection once proven green, so a build-but-broken flow can't auto-merge.
  e2e:
    name: e2e functional journeys (BUILDS != WORKS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # CI uses the owner role for both connections (RLS is exercised separately by the `migrate` job
      # + the readiness gate); DIRECT_DATABASE_URL MUST be set or signup fails (the prod lesson).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gm
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gm
      AUTH_SECRET: ci-e2e-not-a-real-secret-000000000000000000
      NEXTAUTH_SECRET: ci-e2e-not-a-real-secret-000000000000000000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Migrate (fresh DB — full chain)
        run: pnpm --filter @gm/db exec tsx src/migrate.ts
      - name: Install Playwright Chromium
        run: pnpm --filter @gm/web exec playwright install --with-deps chromium
      - name: Build web
        run: pnpm --filter @gm/web build
      - name: Start web + wait for it
        run: |
          pnpm --filter @gm/web exec next start -p 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000 >/dev/null 2>&1; then echo "server up"; exit 0; fi
            sleep 2
          done
          echo "::error::web server did not come up on :3000"; cat /tmp/next.log; exit 1
      - name: Run functional journeys
        run: pnpm --filter @gm/web e2e journeys
        env:
          BASE_URL: http://localhost:3000
          CI: "true"
      - name: Upload E2E artifacts (screenshots/traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            apps/web/test-results
            apps/web/e2e/__screenshots__
          if-no-files-found: ignore
