name: LLM evals (real Gemini, scheduled)

# The real-LLM output-quality suite (packages/core/src/llm/evals/*.eval.test.ts) — receipt extraction,
# recipe import, remix, meal-gen, capture — run against the LIVE Gemini API with golden fixtures and
# pass-rate floors (ROADMAP Track F3). This is the "real, not mocked" tier: per-PR CI fakes the LLM (fast,
# free, deterministic); THIS catches output-quality DRIFT the fakes can't. It costs real API spend, so it
# is SCHEDULED (nightly) + manual — NOT a per-PR required check, and never gates a merge.
#
# One-time owner setup: add the GitHub Actions secret GEMINI_API_KEY (a BILLING-ENABLED key — the free
# tier can't parse receipts) and set a Gemini spend cap. Until the secret is set, the run skips (never red).
on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC nightly (offset from the other crons)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write # so a regression opens/updates an actionable issue for the loop

jobs:
  evals:
    name: llm evals (real gemini, gated)
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Dummy — the evals are LLM-output-quality only (no real DB reads), but loadEnv() requires a URL.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
    steps:
      - uses: actions/checkout@v4

      - name: Skip when no Gemini key (never red before the owner connects it)
        id: guard
        run: |
          if [ -z "${GEMINI_API_KEY}" ]; then
            echo "::warning::GEMINI_API_KEY secret not set — skipping the real-LLM eval run. Add it (a"
            echo "::warning::billing-enabled key) in Settings → Secrets → Actions + set a Gemini spend cap."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        if: steps.guard.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Run LLM evals (RUN_EVALS=1, live Gemini)
        if: steps.guard.outputs.skip != 'true'
        run: bash scripts/run-evals.sh

      - name: Open/refresh an issue on eval regression
        if: failure() && steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="The scheduled real-LLM eval suite failed — an AI stage (receipt extraction / recipe import / remix / meal-gen / capture) dropped below its pass-rate floor. This catches output-quality drift the deterministic per-PR tests cannot. See the run log; add any mis-parsed REAL case to packages/core/src/llm/evals/fixtures.ts (the ratchet), then fix the stage."
          EXISTING=$(gh issue list --state open --search "eval regression in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Recurred $(date -u +%F). ${BODY}"
          else
            gh issue create --title "eval regression: real-LLM output-quality suite failed" --body "${BODY}" || true
          fi
