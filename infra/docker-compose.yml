# Local dev infra: Postgres (with pgvector) + Redis.
# Usage: docker compose -f infra/docker-compose.yml up -d
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gm_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: grocery_manager
    ports:
      - "5432:5432"
    volumes:
      - gm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gm_redis
    ports:
      - "6379:6379"
    volumes:
      - gm_redisdata:/data

volumes:
  gm_pgdata:
  gm_redisdata:
